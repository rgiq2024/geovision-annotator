# Publishes the portal UI (frontend/) to GitHub Pages.
# The hosted page browses Wayback, imports AOIs and drafts annotations on its own;
# point it at a running backend (Export tab -> Server) to fetch, detect and export.
name: Publish portal to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend }
      - id: deploy
        uses: actions/deploy-pages@v4
